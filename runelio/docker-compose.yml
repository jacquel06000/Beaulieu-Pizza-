# Déploiement sur un VPS (ex. Hostinger). Guide pas à pas : docs/INSTALLATION-VPS.md
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: runelio
      POSTGRES_USER: runelio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runelio"]
      interval: 5s
      retries: 10

  # Outils (migrations, rôle admin) : docker compose run --rm migrate
  migrate:
    build: { context: ., target: builder }
    command: ["npx", "drizzle-kit", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://runelio:${POSTGRES_PASSWORD}@db:5432/runelio
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://runelio:${POSTGRES_PASSWORD}@db:5432/runelio
    expose:
      - "3000"
    depends_on:
      db: { condition: service_healthy }

  # Rappels e-mail : appelle l'application toutes les heures (envoi à partir de 17 h, une fois par séance).
  cron:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl -fsS -m 120 -X POST -H "Authorization: Bearer $$CRON_SECRET" http://app:3000/api/cron/reminders || true; sleep 3600; done'
    depends_on:
      - app

  # HTTPS automatique (certificat Let's Encrypt) devant l'application.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
