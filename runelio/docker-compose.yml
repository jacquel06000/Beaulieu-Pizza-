# Déploiement sur un VPS (ex. Hostinger). Placer un reverse-proxy HTTPS devant le port 3000.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: runelio
      POSTGRES_USER: runelio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runelio"]
      interval: 5s
      retries: 10

  # Migrations : docker compose run --rm migrate
  migrate:
    build: { context: ., target: builder }
    command: ["npx", "drizzle-kit", "migrate"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://runelio:${POSTGRES_PASSWORD}@db:5432/runelio
    depends_on:
      db: { condition: service_healthy }
    profiles: ["tools"]

  app:
    build: { context: ., target: runner }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://runelio:${POSTGRES_PASSWORD}@db:5432/runelio
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
