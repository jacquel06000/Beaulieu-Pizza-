<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beaulieu Pizza — Pizzeria artisanale à Beaulieu-sur-Mer</title>
  <meta id="meta-description" name="description" content="Pizzeria artisanale à Beaulieu-sur-Mer : pâte maison, produits frais, cuisson au four traditionnel. Sur place, à emporter ou en livraison. Commande par téléphone au 04 93 01 00 51.">
  <meta name="theme-color" content="#0B0B0B">
  <link rel="canonical" href="https://www.beaulieu-pizza.fr/">

  <!-- Open Graph / réseaux sociaux -->
  <meta property="og:type" content="restaurant">
  <meta property="og:site_name" content="Beaulieu Pizza">
  <meta id="og-title" property="og:title" content="Beaulieu Pizza — Pizzeria artisanale à Beaulieu-sur-Mer">
  <meta id="og-description" property="og:description" content="Pâte maison, produits frais, cuisson au four traditionnel. Sur place, à emporter ou en livraison. Commande par téléphone.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1541745537411-b8046dc6d66c?w=1200&amp;q=75&amp;auto=format&amp;fit=crop">
  <meta id="og-locale" property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Note SEO : le sélecteur de langue traduit le site côté client (JS).
       Les balises meta ci-dessus restent en français pour le premier
       chargement / les robots ; pour un référencement multilingue indexé,
       il faudrait des URL séparées par langue (voir README). -->

  <!-- Favicon (monogramme "B" jaune sur fond noir, vectoriel) -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <!-- Performance : préconnexions -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://images.unsplash.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Données structurées Schema.org — remplies dynamiquement depuis site-data.js -->
  <script type="application/ld+json" id="ld-json">{}</script>
</head>
<body>
  <a class="skip-link" href="#main" id="skip-link">Aller au contenu principal</a>

  <!-- =================== HEADER =================== -->
  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <a href="#accueil" class="logo" id="logo-link" aria-label="Beaulieu Pizza — retour à l’accueil">
        Beaulieu <span>Pizza</span>
      </a>

      <nav id="nav-desktop" class="nav-desktop" aria-label="Navigation principale"></nav>

      <div class="header-actions">
        <div class="lang-switcher" id="lang-switcher"></div>

        <a class="btn btn--primary" data-order-url href="#" id="header-order-btn">
          <i data-lucide="phone-call"></i> <span id="header-order-text"></span>
        </a>
        <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-mobile-links">
          <i data-lucide="menu"></i>
        </button>
      </div>
    </div>
    <nav id="nav-mobile-links" class="nav-mobile" aria-label="Navigation mobile"></nav>
  </header>

  <main id="main">

    <!-- =================== HERO =================== -->
    <section id="accueil" class="hero" aria-labelledby="hero-title">
      <div class="hero-media" aria-hidden="true">
        <img id="hero-image" src="" alt="" fetchpriority="high">
      </div>
      <div class="container">
        <div class="hero-content">
          <p class="eyebrow" id="hero-eyebrow"></p>
          <h1 id="hero-title"></h1>
          <p class="hero-text" id="hero-text"></p>
          <div class="hero-actions">
            <a class="btn btn--primary btn--lg" data-order-url href="#">
              <i data-lucide="phone-call"></i> <span id="hero-cta-primary"></span>
            </a>
            <a class="btn btn--secondary btn--lg" href="#carte">
              <i data-lucide="book-open"></i> <span id="hero-cta-secondary"></span>
            </a>
          </div>
          <ul class="hero-services" id="hero-services"></ul>
        </div>
      </div>
    </section>

    <!-- =================== ENGAGEMENTS =================== -->
    <section class="section" aria-labelledby="commitments-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="commitments-eyebrow"></p>
          <h2 id="commitments-title"></h2>
        </div>
        <div class="commitments-grid" id="commitments-grid"></div>
      </div>
    </section>

    <!-- =================== PIZZAS POPULAIRES =================== -->
    <section class="section section--alt grain" aria-labelledby="popular-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="popular-eyebrow"></p>
          <h2 id="popular-title"></h2>
          <p id="popular-intro"></p>
        </div>
        <div class="pizza-grid" id="popular-pizza-grid"></div>
      </div>
    </section>

    <!-- =================== LA CARTE =================== -->
    <section id="carte" class="section" aria-labelledby="carte-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="menu-eyebrow"></p>
          <h2 id="carte-title"></h2>
          <p id="menu-intro"></p>
        </div>
        <div class="menu-filters" id="menu-filters" role="group"></div>
        <p class="hours-note" id="menu-note"></p>
        <div id="menu-categories"></div>
      </div>
    </section>

    <!-- =================== NOTRE HISTOIRE =================== -->
    <section id="histoire" class="section section--alt grain" aria-labelledby="histoire-title">
      <div class="container about-grid">
        <div class="about-photo">
          <img id="about-image" src="" alt="" loading="lazy" width="700" height="875">
        </div>
        <div class="about-text">
          <p class="eyebrow" id="histoire-eyebrow"></p>
          <h2 id="histoire-title"><span id="histoire-title-prefix"></span> <span id="about-year"></span></h2>
          <div id="about-paragraphs"></div>
          <div class="about-stats">
            <div class="about-stat">
              <strong id="about-years-count"></strong>
              <span id="about-stat-years-label"></span>
            </div>
            <div class="about-stat">
              <strong>100%</strong>
              <span id="about-stat-homemade-label"></span>
            </div>
            <div class="about-stat">
              <strong>400°C</strong>
              <span id="about-stat-oven-label"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- =================== AVIS CLIENTS =================== -->
    <section class="section section--alt grain" aria-labelledby="avis-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="testimonials-eyebrow"></p>
          <h2 id="avis-title"></h2>
        </div>
        <div class="testimonial-grid" id="testimonial-grid"></div>
      </div>
    </section>

    <!-- =================== INFORMATIONS PRATIQUES =================== -->
    <section id="contact" class="section" aria-labelledby="contact-title">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow" id="contact-eyebrow"></p>
          <h2 id="contact-title"></h2>
        </div>
        <div class="practical-grid">
          <div class="practical-card">
            <div class="practical-block">
              <h3 id="label-address"></h3>
              <address id="practical-address"></address>
              <p><a class="link-underline" data-maps-url href="#" target="_blank" rel="noopener" id="maps-link"></a></p>
            </div>
            <div class="practical-block">
              <h3 id="label-phone"></h3>
              <p><a class="link-underline" data-order-url href="#" data-phone-display>—</a></p>
            </div>
            <div class="practical-block">
              <h3 id="label-hours"></h3>
              <div class="hours-table" id="hours-table"></div>
              <p class="hours-note" id="hours-note"></p>
            </div>
            <div class="practical-block">
              <h3 id="label-services"></h3>
              <div class="services-row" id="services-row"></div>
            </div>
            <a class="btn btn--primary btn--lg btn--block" data-order-url href="#">
              <i data-lucide="phone-call"></i> <span id="contact-call-text"></span>
            </a>
            <a class="btn btn--secondary btn--lg btn--block" id="uber-eats-btn" href="#" target="_blank" rel="noopener">
              <i data-lucide="bike"></i> <span id="uber-eats-text"></span>
            </a>
          </div>
          <div class="map-frame">
            <iframe id="map-frame" title="Localisation de Beaulieu Pizza sur Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- =================== FOOTER =================== -->
  <footer class="site-footer">
    <div class="container footer-grid">
      <div class="footer-brand">
        <a href="#accueil" class="logo">Beaulieu <span>Pizza</span></a>
        <p id="footer-tagline"></p>
        <div class="footer-social-row">
          <a class="footer-social" id="footer-instagram" href="#" target="_blank" rel="noopener">
            <i data-lucide="instagram"></i> @beaulieu_pizza
          </a>
          <a class="footer-social" id="footer-uber-eats" href="#" target="_blank" rel="noopener">
            <i data-lucide="bike"></i> Uber Eats
          </a>
        </div>
      </div>
      <div class="footer-col">
        <h4 id="footer-nav-label"></h4>
        <ul id="footer-nav"></ul>
      </div>
      <div class="footer-col">
        <h4 id="footer-address-label"></h4>
        <ul id="footer-address"></ul>
      </div>
      <div class="footer-col">
        <h4 id="footer-hours-label"></h4>
        <ul id="footer-hours"></ul>
      </div>
    </div>
    <div class="container footer-bottom">
      <div class="footer-legal" id="footer-legal"></div>
      <p>© <span id="footer-year"></span> Beaulieu Pizza. <span id="footer-rights"></span></p>
    </div>
  </footer>

  <!-- =================== BOUTON D’APPEL FLOTTANT =================== -->
  <a class="float-call" id="float-call-btn" data-order-url href="#">
    <i data-lucide="phone-call"></i>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/site-data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
